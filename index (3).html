function bmr(p){ const kg=+p.peso, cm=+p.estatura, e=+p.edad; if(!kg||!cm||!e) return null; return 10*kg+6.25*cm-5*e+(p.sexo==="Mujer"?-161:5); }

function imcCat(v){ if(v<18.5) return ["Bajo peso","var(--amber)"]; if(v<25) return ["Peso saludable","var(--green)"]; if(v<30) return ["Sobrepeso","var(--amber)"]; return ["Obesidad","var(--coral)"]; }
function planCalculo(p){
  if(!p.fechaObjetivo || !p.kgPerder) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const fin=new Date(p.fechaObjetivo+"T00:00:00");
  const dias=Math.max(1,Math.round((fin-hoy)/86400000));
  const semanas=dias/7;
  const kg=+p.kgPerder;
  const ritmoSemanal=+(kg/semanas).toFixed(2);
  const tdee=tdeeDe(p); if(!tdee) return null;
  const suelo=p.sexo==="Mujer"?1200:1500;
  const deficit=(kg*7700)/dias;
  let objetivo=Math.round(tdee-deficit);
  const seguro = ritmoSemanal<=1 && objetivo>=suelo;
  if(objetivo<suelo) objetivo=suelo;
  return { dias, semanas:+semanas.toFixed(1), ritmoSemanal, tdee:Math.round(tdee), deficit:Math.round(deficit), objetivo, seguro, suelo };
}
function targetDe(p){ const pc=planCalculo(p); return pc? pc.objetivo : objetivoCalorico(p); }

async function callClaude({system,userText,imageB64,mediaType,key,temperature}){
  const content=[]; if(imageB64) content.push({type:"image",source:{type:"base64",media_type:mediaType,data:imageB64}});
  content.push({type:"text",text:userText});
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:CLAUDE_MODEL,max_tokens:2000,temperature:temperature==null?0.7:temperature,system,messages:[{role:"user",content}]})});
  const data=await res.json(); if(data.error) throw new Error(data.error.message||"Error de Claude");
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
async function callGemini({system,userText,imageB64,mediaType,key,temperature}){
  const parts=[{text:userText}]; if(imageB64) parts.push({inline_data:{mime_type:mediaType,data:imageB64}});
  const body={contents:[{role:"user",parts}],generationConfig:{maxOutputTokens:2000,temperature:temperature==null?0.6:temperature}};
  if(system) body.systemInstruction={parts:[{text:system}]};
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await res.json(); if(data.error) throw new Error(data.error.message||"Error de Gemini");
  return (data.candidates && data.candidates[0] && data.candidates[0].content ? data.candidates[0].content.parts : []).map(p=>p.text||"").join("");
}
async function callAI(a){
  const s=a.settings||{};
  if(!s.geminiKey) throw new Error("Falta tu clave de Google (Gemini). Ábrela en Ajustes ⚙️."); return callGemini({...a,key:s.geminiKey});
}
function hasKey(s){ return !!s.geminiKey; }
function parseJSON(txt){
  let s=txt.replace(/```json|```/g,"").trim();
  const a=s.indexOf("{"),b=s.lastIndexOf("}"),c=s.indexOf("["),d=s.lastIndexOf("]");
  try{ if(a!==-1&&(c===-1||a<c)) return JSON.parse(s.slice(a,b+1)); if(c!==-1) return JSON.parse(s.slice(c,d+1)); return JSON.parse(s);}catch{ return null; }
}

function Ring({consumed,target}){

function LineChartSVG({data}){
  if(data.length<2) return <div className="empty" style={{padding:24}}>Registra tu peso al menos dos veces para ver la curva.</div>;
  const W=300,H=170,padL=30,padR=8,padT=10,padB=22;
  const vals=data.map(d=>d.value); let min=Math.min(...vals),max=Math.max(...vals); if(min===max){min-=1;max+=1;} const range=max-min;
  const x=i=>padL+i*(W-padL-padR)/(data.length-1);
  const y=v=>padT+(1-(v-min)/range)*(H-padT-padB);
  const pts=data.map((d,i)=>x(i)+","+y(d.value)).join(" ");
  return (
    <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%"}}>
      {[max,(max+min)/2,min].map((v,i)=>{ const yy=padT+i*(H-padT-padB)/2; return (
        <g key={i}><line x1={padL} x2={W-padR} y1={yy} y2={yy} stroke="#EDEBE2" /><text x={2} y={yy+3} fontSize="9" fill="#6E7B72">{v.toFixed(1)}</text></g>
      );})}
      <polyline points={pts} fill="none" stroke="#2E7D4F" strokeWidth="2.5" strokeLinejoin="round" />
      {data.map((d,i)=><circle key={i} cx={x(i)} cy={y(d.value)} r="3" fill="#2E7D4F" />)}
      {data.map((d,i)=>(i===0||i===data.length-1)?<text key={i} x={x(i)} y={H-4} fontSize="9" fill="#6E7B72" textAnchor="middle">{d.label}</text>:null)}
    </svg>
  );
}
function BarChartSVG({data,goal}){
  const W=320,H=180,padL=24,padB=20,padT=6; const bw=(W-padL-4)/data.length;
  const max=Math.max(goal||0,...data.map(d=>d.kcal),1);
  const y=v=>padT+(1-v/max)*(H-padT-padB);
  return (
    <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%"}}>
      {goal?<line x1={padL} x2={W-2} y1={y(goal)} y2={y(goal)} stroke="#E15A3C" strokeDasharray="4 3" />:null}
      {data.map((d,i)=>{ const bh=(d.kcal/max)*(H-padT-padB); return <rect key={i} x={padL+i*bw+1} y={H-padB-bh} width={Math.max(bw-2,1)} height={bh} rx="3" fill="#AEDC3C" />; })}
      {data.map((d,i)=> i%2===0?<text key={i} x={padL+i*bw+bw/2} y={H-6} fontSize="8" fill="#6E7B72" textAnchor="middle">{d.etq}</text>:null)}
    </svg>
  );
}

function VozComer({active,target,consumed,burned,settings,onAdd}){
  const [estado,setEstado]=useState("idle"); const [texto,setTexto]=useState(""); const [resp,setResp]=useState(null);
  const preguntar=async(t)=>{ setEstado("thinking"); const restantes=target-consumed+burned;
    try{ const txt=await callAI({settings,temperature:1.0,system:"Eres un coach "+coachDe(settings)+"; ayudas a decidir si algo cabe en el día. Nunca ofensivo ni sobre el cuerpo."+saleroHint(settings),userText:`El usuario quiere comerse: "${t}". Le quedan ${restantes} kcal de su objetivo diario de ${target}. Estima las kcal de eso y decide con humor si le cabe (puede=true) o mejor no (puede=false, porque no cabe o es poco sano). Responde SOLO con JSON: {"nombre":"resumen corto","calorias":entero,"salud":"sano"|"moderado"|"poco_sano","puede":true|false,"respuesta":"1-2 frases con el humor de su tierra diciendo si puede o no y por qué"}`});
      const j=parseJSON(txt); if(j){ setResp(j); speak(j.respuesta); } else setResp({respuesta:"No me he enterao bien, pisha. Repítelo."});
    }catch(e){ setResp({respuesta:"Uy, fallo: "+e.message}); } finally{ setEstado("done"); } };
  const escuchar=()=>{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ setResp({respuesta:"Tu navegador no soporta voz, pisha. Con Chrome funciona de lujo."}); setEstado("done"); return; }
    const rec=new SR(); rec.lang="es-ES"; rec.interimResults=false; rec.maxAlternatives=1;
    setEstado("listening"); setResp(null); setTexto("");
    rec.onresult=(e)=>{ const t=e.results[0][0].transcript; setTexto(t); preguntar(t); };
    rec.onerror=()=>setEstado("idle"); rec.onend=()=>setEstado(s=>s==="listening"?"idle":s);
    try{ rec.start(); }catch{ setEstado("idle"); } };
  const anadir=()=>{ if(resp&&resp.calorias){ onAdd({nombre:resp.nombre,calorias:resp.calorias,salud:resp.salud||"moderado"}); setResp(null); setTexto(""); setEstado("idle"); } };
  return (
    <div className="voz-card">
      <div className="eyebrow" style={{marginBottom:12}}>🎙️ Pregúntame por voz</div>
      <button className={"mic"+(estado==="listening"?" rec":"")} onClick={escuchar}>{estado==="thinking"?<Spinner/>:"🎤"}</button>
      <div className="note" style={{marginTop:12}}>{estado==="listening"?"Escuchando… dime qué te vas a comer":estado==="thinking"?"Pensándolo con salero…":"Toca y di: “¿me puedo comer una hamburguesa?”"}</div>
      {texto && <div style={{marginTop:12,fontWeight:600}}>“{texto}”</div>}
      {resp && (

/* ================= AYUNO INTERMITENTE ================= */
const AYUNOS=[
  ["12:12","12 h comiendo / 12 h en ayuno","El más suave, ideal para empezar. Separa cena y desayuno 12 h (p.ej. 20:00 → 08:00).",12],
  ["14:10","14 h ayuno / 10 h comiendo","Un pasito más. Ventana de comida de 10 h (p.ej. 10:00–20:00).",10],
  ["16:8","16 h ayuno / 8 h comiendo","El más popular. Ventana de 8 h (p.ej. 12:00–20:00): te saltas el desayuno o la cena.",8],
  ["18:6","18 h ayuno / 6 h comiendo","Avanzado. Ventana de 6 h. Solo con experiencia y si te sienta bien.",6],
];
function AyunoView({active,settings,back}){
  const [metodo,setMetodo]=useState("16:8"); const [inicio,setInicio]=useState(12); const [ahora,setAhora]=useState(new Date());
  const [tip,setTip]=useState(null); const [tipLoad,setTipLoad]=useState(false);
  useEffect(()=>{ store.get("nf_ayuno_"+active.id,null).then(x=>{ if(x){ setMetodo(x.metodo||"16:8"); setInicio(x.inicio==null?12:x.inicio); } }); },[active.id]);
  useEffect(()=>{ const t=setInterval(()=>setAhora(new Date()),30000); return ()=>clearInterval(t); },[]);
  const guardar=(m,i)=>{ setMetodo(m); setInicio(i); store.set("nf_ayuno_"+active.id,{metodo:m,inicio:i}); };
  const horas=(AYUNOS.find(a=>a[0]===metodo)||AYUNOS[2])[3];
  const finH=(inicio+horas)%24;
  const hDec=ahora.getHours()+ahora.getMinutes()/60;
  const enVentana = inicio<finH ? (hDec>=inicio&&hDec<finH) : (hDec>=inicio||hDec<finH);
  let restante; if(enVentana){ let f=finH; if(f<=hDec) f+=24; restante=f-hDec; } else { let s=inicio; if(s<=hDec) s+=24; restante=s-hDec; }
  const hh=Math.floor(restante), mm=Math.round((restante-hh)*60);
  const consejo=async()=>{ setTipLoad(true);
    try{ const txt=await callAI({settings,temperature:0.7,system:"Eres un nutricionista basado en evidencia, cercano y con un puntito del humor de "+reg(settings).label+". Explicas el ayuno intermitente de forma segura y realista, sin venderlo como milagro (su principal beneficio suele ser ayudar a controlar las calorías y la adherencia). Español.",userText:`Da 3 consejos prácticos para hacer bien el ayuno ${metodo} en el caso de ${active.nombre} (${active.sexo}, ${active.edad} años, objetivo ${active.target} kcal). Menciona qué tomar en el ayuno (agua, café solo, infusiones) y una señal para parar si sienta mal. Responde en texto plano, breve.`});
      setTip(txt.trim());
    }catch(e){ setTip("No se pudo generar: "+e.message);} finally{ setTipLoad(false);} };
  return (
    <div className="wrap fade">
      <button className="link" style={{display:"flex",alignItems:"center",gap:6,marginBottom:14}} onClick={back}>← Volver</button>
      <div className="eyebrow">Ayuno intermitente</div>
      <h1 style={{fontSize:24,margin:"4px 0 6px",fontWeight:600}}>Come en tu ventana ⏱️</h1>
      <p className="note" style={{marginBottom:16}}>El ayuno intermitente consiste en concentrar las comidas en una franja del día. No es magia: ayuda sobre todo porque facilita comer menos y con más orden. Elige tu método:</p>

      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
        {AYUNOS.map(a=><button key={a[0]} className={"metric-chip"+(metodo===a[0]?" on":"")} onClick={()=>guardar(a[0],inicio)}>{a[0]}</button>)}
      </div>
      <div className="card" style={{marginBottom:14}}>
        <div style={{fontWeight:600,marginBottom:4}}>{(AYUNOS.find(a=>a[0]===metodo)||AYUNOS[2])[1]}</div>
        <div className="note">{(AYUNOS.find(a=>a[0]===metodo)||AYUNOS[2])[2]}</div>
        <div className="field" style={{marginTop:12,marginBottom:0}}><label>¿A qué hora empiezas a comer?</label>
          <select className="select" value={inicio} onChange={e=>guardar(metodo,+e.target.value)}>{Array.from({length:24}).map((_,i)=><option key={i} value={i}>{String(i).padStart(2,"0")}:00</option>)}</select></div>
      </div>

      <div className="goal-card" style={{marginBottom:16,background:enVentana?"linear-gradient(135deg,#1E7A44,#2E9E5B)":"linear-gradient(135deg,#3a6ea5,#4f8cc9)"}}>
        <div style={{fontSize:11,opacity:.85,textTransform:"uppercase",letterSpacing:1}}>{enVentana?"🍽️ Ventana de comida abierta":"🌙 En ayuno"}</div>
        <div className="big" style={{marginTop:4}}>{hh}h {mm}min</div>
        <div style={{fontSize:13,opacity:.9,marginTop:6}}>{enVentana?`Cierra a las ${String(finH).padStart(2,"0")}:00`:`Puedes comer a las ${String(inicio).padStart(2,"0")}:00`} · Ventana {String(inicio).padStart(2,"0")}:00–{String(finH).padStart(2,"0")}:00</div>
      </div>

      <button className="btn btn-primary" onClick={consejo} disabled={tipLoad}>{tipLoad?<><Spinner/> Pensando…</>:<>✨ Consejos para hacerlo bien</>}</button>
      {tip && <div className="card" style={{marginTop:14,background:"var(--lime-soft)",border:"none",fontSize:14,lineHeight:1.55,whiteSpace:"pre-wrap"}}>{tip}</div>}

      <div className="card" style={{marginTop:16}}>
        <div className="eyebrow" style={{marginBottom:10}}>🔬 Lo que dice la ciencia (sin humo)</div>
        <p style={{fontSize:14,lineHeight:1.55}}>La mayoría de estudios indican que el ayuno intermitente adelgaza <b>porque ayuda a comer menos calorías</b>, no por un efecto mágico: a igualdad de calorías y proteína, los resultados son parecidos a otras dietas. Puede mejorar la relación con el picoteo y ordenar las comidas. En el ayuno se puede tomar agua, café solo o infusiones sin azúcar.</p>
      </div>
      <div className="warn" style={{marginTop:14}}>⚠️ El ayuno <b>no es para todo el mundo</b>. Evítalo o consulta antes con tu médico si estás embarazada o en lactancia, eres menor, tienes diabetes con medicación, tomas fármacos con las comidas o tienes (o has tenido) un trastorno de la conducta alimentaria. Si te mareas, te sienta mal o te obsesiona, párate.</div>
    </div>
  );
}

function EntrenadorView({active,settings,back,onWorkoutDone}){
  const [c,setC]=useState(ENT_DEF); const [plan,setPlan]=useState(null); const [loading,setLoading]=useState(false); const [err,setErr]=useState(null); const [dia,setDia]=useState(0); const [done,setDone]=useState([]);

  const set=(k,v)=>setC(x=>({...x,[k]:v}));
  const mondayOf=(iso)=>{ const x=new Date(iso+"T00:00:00"); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return dkey(x); };
  const hoy=dkey(); const hechoHoy=done.indexOf(hoy)>-1; const goal=+c.dias||3;

function cerdoLevel(n){ if(n<15)return 0; if(n<35)return 1; if(n<55)return 2; if(n<78)return 3; return 4; }
const CERDO_MSG=[
  ["¡Oink oink! Mírame, hecho un chulazo gracias a ti, pisha 💪","¡Estoy fino filipino, quillo! Sigue así.","Delgadito y feliz, mi arma. ¡Ole tú!"],
  ["Voy bien, pisha, pero no te me confíes.","Oink, de momento en mi peso. ¡A seguir!","Tirando bien, quillo, no me despistes."],
  ["Ejem… noto el pantalón un pelín justo, ¿eh?","Como te despistes, empiezo a redondearme, illo.","Oink… que se me ve un flotadorcillo, cuidao."],
  ["¡Oink! Que estoy cogiendo lorzas, pisha. Ponme a dieta ya.","Me cuesta verme los pezuñas, quillo… ¡ayúdame!","Que reboto un poquito al andar, mi arma. Sácame a pasear."],
  ["¡SOCORRO! Que estoy como una bola, pisha 😰 Registra algo sano o sácame a andar YA.","No quepo por la puerta, mi arma. ¡Necesito una ensalada urgente!","¡Oink de emergencia! Como sigas sin dieta, exploto, quillo 🐷💥"],
];
function Cerdito({nivel}){
  const lvl=cerdoLevel(nivel); const forma=Math.max(0,100-nivel);
  const size=Math.round(46+(nivel/100)*48);
  const acc=lvl===0?"💪":lvl===3?"🍔":lvl>=4?"😰":"";
  const [n,setN]=useState(0);
  const msg=React.useMemo(()=>{ const p=CERDO_MSG[lvl]; return p[Math.floor(Math.random()*p.length)]; },[lvl,n]);
  const barColor=lvl<=1?"var(--green)":lvl===2?"var(--amber)":"var(--coral)";
  return (
    <div className="card" style={{marginTop:16,display:"flex",gap:14,alignItems:"center"}}>
      <div style={{lineHeight:1,textAlign:"center",minWidth:96}}>
        <div style={{fontSize:size}}>🐷</div>{acc&&<div style={{fontSize:20,marginTop:-4}}>{acc}</div>}
      </div>
      <div style={{flex:1}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:700,fontSize:14}}>Pepe el cerdito</div>

        <div style={{fontSize:13,lineHeight:1.45,marginTop:2}}>{msg}</div>

        <div className="bar-track"><div className="bar-fill" style={{width:forma+"%",background:barColor}}/></div>

}

function Camara({active,onAdd,settings}){
  const [img,setImg]=useState(null),[b64,setB64]=useState(null),[mime,setMime]=useState(null);
  const [loading,setLoading]=useState(false),[result,setResult]=useState(null),[error,setError]=useState(null),[added,setAdded]=useState(false);
  const fileRef=useRef();
  const pick=(e)=>{ const file=e.target.files[0]; if(!file) return; setResult(null); setError(null); setAdded(false);

function Progreso({active,profiles,saveProfiles,settings,go}){

      setDaily(arr); let s=0; for(let i=arr.length-1;i>=0;i--){ if(arr[i].kcal>0) s++; else break; } setStreak(s); })();
    (async()=>{ const ks=await store.keys("nf_resumen_"+active.id+"_"); const arr=[]; for(const k of ks){ const v=await store.get(k,null); if(v&&v.texto) arr.push(v); } arr.sort((a,b)=>b.fecha.localeCompare(a.fecha)); setDiario(arr); })();

      )}
      <div className="seg" style={{marginBottom:16}}>
        <button className={tab==="medidas"?"on":""} onClick={()=>setTab("medidas")}>Medidas</button>
        <button className={tab==="cal"?"on":""} onClick={()=>setTab("cal")}>Calorías</button>
        <button className={tab==="logros"?"on":""} onClick={()=>setTab("logros")}>Logros</button>
        <button className={tab==="diario"?"on":""} onClick={()=>setTab("diario")}>Diario</button>
      </div>

      {tab==="medidas" && (<>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
          {METRICAS.map(([k,l])=><button key={k} className={"metric-chip"+(metric===k?" on":"")} onClick={()=>setMetric(k)}>{l}</button>)}
        </div>
        <div className="card"><div className="eyebrow" style={{marginBottom:12}}>{METRICAS.find(m=>m[0]===metric)[1]} ({unidad(metric)})</div><LineChartSVG data={serie(metric)} /></div>
        <div className="card" style={{marginTop:14}}>
          <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:10}}>Registrar hoy (rellena lo que quieras)</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {METRICAS.map(([k,l,u])=>(
              <div key={k}><div className="note" style={{marginBottom:4}}>{l} ({u})</div>
                <input className="input" type="number" inputMode="decimal" placeholder={u} value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} /></div>
            ))}
          </div>
          <button className="btn btn-primary" style={{marginTop:12}} onClick={addMedida}>➕ Guardar medidas</button>
        </div>
        <div className="card" style={{marginTop:14,display:"flex",alignItems:"center",gap:12}}>❤️<div><div style={{fontFamily:"Fraunces",fontSize:22,fontWeight:600}}>IMC {iv||"—"}</div>{cat&&<div className="note" style={{color:cat[1],fontWeight:600}}>{cat[0]}</div>}</div></div>
      </>)}

      {tab==="cal" && (
        <div className="card"><div className="eyebrow" style={{marginBottom:12}}>Calorías · últimos 14 días</div><BarChartSVG data={daily} goal={active.target} />
          <div className="note" style={{textAlign:"center",marginTop:8}}>Objetivo: {active.target} kcal · Media: {media} kcal</div></div>
      )}

      {tab==="logros" && <Logros streak={streak} cambio={cambioPeso} weights={serie("peso")} daily={daily} />}

      {tab==="diario" && (
        diario.length===0 ? <div className="card empty">📔<br/>Aún no hay resúmenes guardados. Genera el “Resumen del día” en Inicio y se guardará aquí.</div>
        : diario.map((d,i)=>(
          <div key={i} className="diario-item"><div className="diario-fecha">{fmtCorta(d.fecha)}{d.neto!=null?` · ${d.neto} kcal netas`:""}</div><div style={{fontSize:14,lineHeight:1.5}}>{d.texto}</div></div>
        ))
      )}

      <div className="card" style={{marginTop:16,background:"var(--blue-soft)",border:"none"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:7,fontWeight:700,fontSize:13}}>✨ Análisis de tu progreso</div>
          <button className="link" onClick={analizar} disabled={anLoad}>{anLoad?"…":"Analizar"}</button>
        </div>
        <p style={{fontSize:14,lineHeight:1.55}}>{anLoad?"Analizando tu evolución…":(analisis||"Toca “Analizar” para que la IA revise tu peso y medidas y te dé recomendaciones.")}</p>
      </div>
    </div>
  );
}

/* ================= PERFILES ================= */
function Perfiles({profiles,activeId,save,setActive}){
  const blank={nombre:"",sexo:"Mujer",edad:"",estatura:"",peso:"",actividad:"Ligero",zonas:[],fechaObjetivo:"",kgPerder:""};
  const [form,setForm]=useState(null);
  const toggleZona=(z)=>setForm(f=>({...f,zonas:f.zonas.includes(z)?f.zonas.filter(x=>x!==z):[...f.zonas,z]}));
  const guardar=()=>{ if(!form.nombre.trim()||!form.edad||!form.estatura||!form.peso) return;
    const target=targetDe(form); const rec={...form,target,macros:macrosObjetivo(target),aguaGoal:aguaObjetivo(form.peso),id:form.id||Date.now()};
    const list=form.id?profiles.map(p=>p.id===form.id?rec:p):[...profiles,rec]; save(list); if(!form.id){ setActive(rec.id); store.set("nf_weight_"+rec.id,[{fecha:dkey(),peso:+form.peso}]); } setForm(null); };
  const borrar=(id)=>{ save(profiles.filter(p=>p.id!==id)); setForm(null); };
  if(form){
    const preview=targetDe(form);
    return (
      <div className="wrap fade">
        <button className="link" style={{display:"flex",alignItems:"center",gap:6,marginBottom:14}} onClick={()=>setForm(null)}>← Volver</button>
        <h1 style={{fontSize:24,margin:"0 0 16px",fontWeight:600}}>{form.id?"Editar perfil":"Nuevo perfil"}</h1>
        <div className="field"><label>Nombre</label><input className="input" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} placeholder="Tu nombre" /></div>
        <div className="field"><label>Sexo</label><select className="select" value={form.sexo} onChange={e=>setForm({...form,sexo:e.target.value})}><option>Mujer</option><option>Hombre</option></select></div>
        <div className="row">
          <div className="field"><label>Edad</label><input className="input" type="number" value={form.edad} onChange={e=>setForm({...form,edad:e.target.value})} placeholder="años" /></div>
          <div className="field"><label>Estatura (cm)</label><input className="input" type="number" value={form.estatura} onChange={e=>setForm({...form,estatura:e.target.value})} placeholder="cm" /></div>
        </div>
        <div className="row">
          <div className="field"><label>Peso (kg)</label><input className="input" type="number" value={form.peso} onChange={e=>setForm({...form,peso:e.target.value})} placeholder="kg" /></div>
          <div className="field"><label>Actividad</label><select className="select" value={form.actividad} onChange={e=>setForm({...form,actividad:e.target.value})}>{Object.keys(ACTIVIDAD).map(a=><option key={a}>{a}</option>)}</select></div>
        </div>
        <div className="field"><label>Zonas que quieres trabajar</label><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{ZONES.map(z=><button key={z} className={"pill"+(form.zonas.includes(z)?" on":"")} onClick={()=>toggleZona(z)}>{z}</button>)}</div></div>
        <div className="eyebrow" style={{margin:"6px 0 10px"}}>Objetivo (opcional)</div>
        <div className="row">
          <div className="field"><label>Fecha objetivo</label><input className="input" type="date" value={form.fechaObjetivo} onChange={e=>setForm({...form,fechaObjetivo:e.target.value})} /></div>
          <div className="field"><label>Kilos a perder</label><input className="input" type="number" value={form.kgPerder} onChange={e=>setForm({...form,kgPerder:e.target.value})} placeholder="kg" /></div>
        </div>
        {preview && <div className="card" style={{background:"var(--lime-soft)",border:"none",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>🔥<div><div style={{fontFamily:"Fraunces",fontSize:22,fontWeight:600}}>{preview} kcal/día</div><div className="note">Objetivo diario calculado{form.fechaObjetivo&&form.kgPerder?" para tu meta":" para adelgazar de forma progresiva"}</div></div></div>}
        <button className="btn btn-primary" onClick={guardar}>✔️ Guardar perfil</button>
        {form.id && <button className="btn btn-ghost" style={{marginTop:10,color:"#a1381f"}} onClick={()=>borrar(form.id)}>🗑️ Eliminar perfil</button>}
      </div>
    );
  }
  return (
    <div className="wrap fade">
      <div className="eyebrow">Perfiles</div>
      <h1 style={{fontSize:24,margin:"4px 0 18px",fontWeight:600}}>Quién usa la app</h1>
      {profiles.length===0 && <div className="card empty" style={{marginBottom:14}}>Todavía no hay perfiles.</div>}
      {profiles.map(p=>(
        <div key={p.id} className="card" style={{marginBottom:12,display:"flex",alignItems:"center",gap:14}}>
          <span className="avatar" style={{width:42,height:42,fontSize:17}}>{p.nombre.charAt(0).toUpperCase()}</span>
          <div style={{flex:1}}><div style={{fontWeight:600,fontSize:16}}>{p.nombre} {p.id===activeId&&<span className="badge b-sano" style={{marginLeft:6,fontSize:10}}>Activo</span>}</div>
            <div className="note" style={{display:"flex",gap:12,marginTop:3}}><span>⚖️ {p.peso}kg</span><span>📏 {p.estatura}cm</span><span>🔥 {p.target}kcal</span></div></div>
          <div style={{display:"flex",gap:8}}>{p.id!==activeId&&<button className="btn btn-ghost btn-sm" onClick={()=>setActive(p.id)}>Usar</button>}<button className="btn btn-ghost btn-sm" onClick={()=>setForm({...p})}>Editar</button></div>
        </div>
      ))}
      <button className="btn btn-primary" style={{marginTop:8}} onClick={()=>setForm({...blank,id:null})}>➕ Añadir perfil</button>
    </div>
  );
}

/* ================= APP ================= */
function App(){
  const [view,setView]=useState("inicio");
  const [profiles,setProfiles]=useState([]); const [activeId,setActiveId]=useState(null);
  const [log,setLog]=useState([]); const [exLog,setExLog]=useState([]); const [water,setWater]=useState(0);
  const [settings,setSettings]=useState({provider:"gemini",geminiKey:"",region:"andalucia"});
  const [ready,setReady]=useState(false); const [switcher,setSwitcher]=useState(false); const [showSettings,setShowSettings]=useState(false);
  const [feedback,setFeedback]=useState(null); const [showResumen,setShowResumen]=useState(false);
  const [cerdo,setCerdo]=useState(20);
  const [reminders,setReminders]=useState({agua:false,aguaCada:2,picoteo:false,ayunoAviso:false,desde:9,hasta:22,telefono:""});
  const [showReminders,setShowReminders]=useState(false);
  const active=profiles.find(p=>p.id===activeId)||null;

  useEffect(()=>{ (async()=>{
    const pr=await store.get("nf_profiles",[]); const act=await store.get("nf_active",null); const st=await store.get("nf_settings",{provider:"gemini",geminiKey:"",region:"andalucia"});
    const rem=await store.get("nf_reminders",{agua:false,aguaCada:2,picoteo:false,ayunoAviso:false,desde:9,hasta:22,telefono:""});
    setProfiles(pr); setSettings(st); setReminders(rem); setActiveId(act||(pr[0]&&pr[0].id)||null); setReady(true);
  })(); },[]);
  useEffect(()=>{ if(!activeId){ setLog([]); setWater(0); setExLog([]); return; }
    store.get("nf_log_"+activeId+"_"+dkey(),[]).then(setLog);
    store.get("nf_water_"+activeId+"_"+dkey(),0).then(setWater);
    store.get("nf_ex_"+activeId+"_"+dkey(),[]).then(setExLog);
    store.get("nf_cerdo_"+activeId,null).then(obj=>{ let nivel=obj?obj.nivel:20; if(obj&&obj.fecha){ const dias=Math.round((new Date(dkey()+"T00:00:00")-new Date(obj.fecha+"T00:00:00"))/86400000); if(dias>0){ nivel=Math.min(100,nivel+Math.min(dias*5,30)); store.set("nf_cerdo_"+activeId,{nivel,fecha:dkey()}); } } setCerdo(nivel); });
  },[activeId]);

  const saveProfiles=(list)=>{ setProfiles(list); store.set("nf_profiles",list); };
  const saveSettings=(s)=>{ setSettings(s); store.set("nf_settings",s); };
  const saveReminders=(r)=>{ setReminders(r); store.set("nf_reminders",r); };

  useEffect(()=>{
    if(!("Notification" in window)) return;
    const enHorario=()=>{ const h=new Date().getHours(); const d=reminders.desde==null?9:reminders.desde, ha=reminders.hasta==null?22:reminders.hasta; return h>=d && h<ha; };
    const notif=(body)=>{ if(Notification.permission==="granted" && enHorario()){ try{ new Notification("Come sano, pisha 🥑",{body}); }catch{} } };
    const timers=[];
    if(reminders.agua) timers.push(setInterval(()=>notif(AGUA_MSG[Math.floor(Math.random()*AGUA_MSG.length)]), Math.max(1,reminders.aguaCada||2)*3600*1000));
    if(reminders.picoteo) timers.push(setInterval(()=>notif(PICOTEO_MSG[Math.floor(Math.random()*PICOTEO_MSG.length)]), 3*3600*1000));
    return ()=>timers.forEach(clearInterval);
  },[reminders]);

  useEffect(()=>{
    if(!("Notification" in window) || !reminders.ayunoAviso || !activeId) return;
    let last="";
    const notif=(body)=>{ if(Notification.permission==="granted"){ try{ new Notification("Come sano, pisha ⏱️",{body}); }catch{} } };
    const check=async()=>{
      const cfg=await store.get("nf_ayuno_"+activeId,null); if(!cfg||cfg.inicio==null) return;
      const now=new Date(); if(now.getMinutes()!==0) return;
      const horas=({"12:12":12,"14:10":10,"16:8":8,"18:6":6})[cfg.metodo]||8;
      const open=cfg.inicio, close=(cfg.inicio+horas)%24; const h=now.getHours(); const tag=h+":"+now.getDate();
      if(h===open && last!=="o"+tag){ last="o"+tag; notif("🍽️ ¡Se abre tu ventana de comida, pisha! A comer con cabeza."); }
      else if(h===close && last!=="c"+tag){ last="c"+tag; notif("🌙 Se cierra la ventana, quillo. A descansar el estómago hasta mañana."); }
    };
    const t=setInterval(check,60000); check();
    return ()=>clearInterval(t);
  },[reminders.ayunoAviso, activeId]);
  const setActive=(id)=>{ setActiveId(id); store.set("nf_active",id); setSwitcher(false); };
  const saveLog=(e)=>{ setLog(e); store.set("nf_log_"+activeId+"_"+dkey(),e); };
  const removeFood=(id)=>saveLog(log.filter(f=>f.id!==id));
  const setAgua=(n)=>{ const v=Math.max(0,n); setWater(v); store.set("nf_water_"+activeId+"_"+dkey(),v); };
  const saveEx=(e)=>{ setExLog(e); store.set("nf_ex_"+activeId+"_"+dkey(),e); };
  const addEx=(x)=>{ saveEx([...exLog,{...x,id:Date.now()+Math.random()}]); bumpCerdo(-6); };
  const removeEx=(id)=>saveEx(exLog.filter(e=>e.id!==id));
  const burned=exLog.reduce((s,e)=>s+(+e.calorias||0),0);
  const bumpCerdo=(delta)=>{ if(!activeId) return; setCerdo(prev=>{ const n=Math.max(0,Math.min(100,Math.round(prev+delta))); store.set("nf_cerdo_"+activeId,{nivel:n,fecha:dkey()}); return n; }); };
  const addFood=(f)=>{ const nuevos=[...log,{...f,id:Date.now()+Math.random()}]; saveLog(nuevos); if(!active) return;
    const total=nuevos.reduce((s,x)=>s+(+x.calorias||0),0); const net=total-burned; const malo=f.salud==="poco_sano"; const pasado=net>active.target;
    bumpCerdo(malo?9:(pasado?6:-5));
    if(malo||pasado) setFeedback({type:"regano",food:f,consumed:net,target:active.target,malo,pasado});
    else setFeedback({type:"ole",text:OLES[Math.floor(Math.random()*OLES.length)]});
  };
  const saveGoal=(fechaObjetivo,kgPerder)=>{ const nuevo={...active,fechaObjetivo,kgPerder}; nuevo.target=targetDe(nuevo); nuevo.macros=macrosObjetivo(nuevo.target); saveProfiles(profiles.map(p=>p.id===active.id?nuevo:p)); };

  const consumed=log.reduce((s,f)=>s+(+f.calorias||0),0);
  const macrosHoy=log.reduce((a,f)=>({p:a.p+(+f.proteinas||0),c:a.c+(+f.carbos||0),g:a.g+(+f.grasas||0)}),{p:0,c:0,g:0});
  const target=active?active.target:null;

  if(!ready) return <div className="nf"><div style={{display:"flex",height:"100vh",alignItems:"center",justifyContent:"center"}}><Spinner big/></div></div>;

  return (
    <div className="nf">
      <header className="hdr"><div className="hdr-top">
        <div onClick={()=>setView("inicio")} style={{cursor:"pointer"}}>
          <div className="brand">Come sano <span>pisha</span></div>
          <div className="tagline">🥑 Comer bien y moverse, con salero 🏃</div>
        </div>
        <div className="hdr-actions">
          <button className="icon-btn" onClick={()=>setShowReminders(true)}>🔔</button>
          <button className="icon-btn" onClick={()=>setShowSettings(true)}>⚙️</button>
          {active? <button className="chip-btn" onClick={()=>setSwitcher(true)}><span className="avatar">{active.nombre.charAt(0).toUpperCase()}</span>{active.nombre}</button>
                 : <button className="chip-btn" onClick={()=>setView("perfiles")}>➕ Perfil</button>}
        </div>
      </div></header>

      {view==="inicio" && <Inicio active={active} consumed={consumed} target={target} macrosHoy={macrosHoy} log={log} water={water} setAgua={setAgua} onRemove={removeFood} go={setView} settings={settings} burned={burned} openResumen={()=>setShowResumen(true)} openPlan={()=>setView("plan")} cerdo={cerdo} />}
      {view==="plan" && (active? <PlanView active={active} saveGoal={saveGoal} settings={settings} back={()=>setView("inicio")} /> : <NoProfile go={setView} />)}
      {view==="habitos" && (active? <HabitosView active={active} settings={settings} back={()=>setView("inicio")} /> : <NoProfile go={setView} />)}
      {view==="entrenador" && (active? <EntrenadorView active={active} settings={settings} back={()=>setView("inicio")} onWorkoutDone={()=>bumpCerdo(-6)} /> : <NoProfile go={setView} />)}
      {view==="ayuno" && (active? <AyunoView active={active} settings={settings} back={()=>setView("inicio")} /> : <NoProfile go={setView} />)}
      {view==="camara" && <Camara active={active} onAdd={addFood} settings={settings} />}
      {view==="menu" && <Menu active={active} log={log} consumed={consumed} target={target} onAdd={addFood} onRemove={removeFood} settings={settings} burned={burned} />}
      {view==="ejercicio" && <Ejercicio active={active} settings={settings} exLog={exLog} addEx={addEx} removeEx={removeEx} burned={burned} />}
      {view==="progreso" && <Progreso active={active} profiles={profiles} saveProfiles={saveProfiles} settings={settings} go={setView} />}
      {view==="perfiles" && <Perfiles profiles={profiles} activeId={activeId} save={saveProfiles} setActive={setActive} />}

      {switcher && (
        <div className="overlay" onClick={()=>setSwitcher(false)}><div className="sheet" onClick={e=>e.stopPropagation()}>
          <SheetTitle title="Cambiar de perfil" onClose={()=>setSwitcher(false)} />
          {profiles.map(p=>(
            <div key={p.id} className="food-item" style={{cursor:"pointer"}} onClick={()=>setActive(p.id)}>
              <span className="avatar" style={{width:34,height:34,fontSize:14}}>{p.nombre.charAt(0).toUpperCase()}</span>
              <div style={{flex:1}}><div style={{fontWeight:600}}>{p.nombre}</div><div className="note">{p.target} kcal/día</div></div>
              {p.id===activeId&&<span style={{color:"#2E7D4F"}}>✔️</span>}
            </div>
          ))}
          <button className="btn btn-ghost" style={{marginTop:14}} onClick={()=>{setSwitcher(false); setView("perfiles");}}>👤 Gestionar perfiles</button>
        </div></div>
      )}
      {showSettings && <SettingsSheet settings={settings} save={saveSettings} onClose={()=>setShowSettings(false)} />}
      {showReminders && <RemindersSheet reminders={reminders} save={saveReminders} onClose={()=>setShowReminders(false)} />}
      {feedback&&feedback.type==="ole" && <ToastOle text={feedback.text} onDone={()=>setFeedback(null)} />}
      {feedback&&feedback.type==="regano" && <ReganoSheet data={feedback} settings={settings} onClose={()=>setFeedback(null)} />}
      {showResumen && active && <ResumenSheet active={active} log={log} exLog={exLog} consumed={consumed} burned={burned} target={target} water={water} settings={settings} onClose={()=>setShowResumen(false)} />}

      <nav className="nav">
        {[["inicio","🏠","Inicio"],["camara","📷","Cámara"],["menu","🍽️","Menú"],["ejercicio","💪","Ejercicio"],["progreso","📈","Progreso"]].map(a=>(
          <button key={a[0]} className={view===a[0]||(a[0]==="inicio"&&(view==="plan"||view==="habitos"||view==="ayuno"||view==="entrenador"))||(a[0]==="progreso"&&view==="perfiles")?"on":""} onClick={()=>setView(a[0])}>
            <span className="ni">{a[1]}</span>{a[2]}
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

(function () {
  try {
    var src = document.getElementById("app-src").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  } catch (err) {
    var r = document.getElementById("root");
    if (r) r.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:34px 24px;color:#a1381f;line-height:1.55"><div style="font-size:34px">😵‍💫</div><b>Uy, no cargó bien.</b><br>' + ((err && err.message) || err) + '</div>';
    console.error(err);
  }
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
